<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08142c">
  <meta name="description" content="Dashboard operasional fumigasi Makassar Project Branch.">
  <meta name="application-name" content="Fumi MKS 2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fumi MKS 2">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./logo-192.png">
  <link rel="apple-touch-icon" href="./logo-192.png">
  <title>Fumi MKS 2</title>
  <style>
    :root { color-scheme: dark; --navy:#08142c; --blue:#087fc1; --red:#e32332; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--navy); font-family:Arial,Helvetica,sans-serif; }
    #app { position:fixed; inset:0; width:100%; height:100%; background:var(--navy); }
    #app-frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
    #loading,#problem { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center; color:#fff; background:radial-gradient(circle at 50% 35%,#12366c 0%,#08142c 65%); z-index:3; }
    #loading[hidden],#problem[hidden] { display:none; }
    .logo { width:min(42vw,170px); height:min(42vw,170px); object-fit:contain; border-radius:24px; }
    .brand { margin:18px 0 5px; font-size:22px; font-weight:800; letter-spacing:.4px; }
    .sub { margin:0; color:#cbd5e1; font-size:13px; }
    .spinner { width:34px; height:34px; margin-top:26px; border:3px solid #ffffff35; border-top-color:#22b8ff; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .problem-title { font-size:21px; font-weight:800; margin:18px 0 8px; }
    .problem-copy { max-width:420px; color:#cbd5e1; font-size:14px; line-height:1.55; }
    .actions { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; justify-content:center; }
    button { border:0; border-radius:10px; padding:12px 18px; font-weight:700; cursor:pointer; }
    #retry { color:white; background:#087fc1; }
    #reopen { color:#10264a; background:#fff; }
    #install { position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:2; display:none; color:#fff; background:#087fc1; box-shadow:0 4px 18px #0005; }
    @media (display-mode:standalone) { #install { display:none!important; } }
  </style>
</head>
<body>
  <main id="app">
    <iframe id="app-frame" title="Fumi MKS 2 — Aplikasi Operasional" allow="clipboard-read; clipboard-write; camera; microphone; geolocation" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <section id="loading" aria-live="polite">
      <img class="logo" src="./logo-512.png" alt="Logo Fumi MKS 2">
      <div class="brand">Fumi MKS 2</div>
      <p class="sub">Fumigation Operations Management System</p>
      <div class="spinner" aria-label="Memuat aplikasi"></div>
      <p class="sub" style="margin-top:14px">Menghubungkan ke aplikasi operasional…</p>
    </section>
    <section id="problem" hidden aria-live="assertive">
      <img class="logo" src="./logo-192.png" alt="Logo Fumi MKS 2">
      <div class="problem-title">Koneksi aplikasi belum tersedia</div>
      <p class="problem-copy">Fumi MKS 2 belum menerima respons pemuatan. Periksa koneksi internet atau coba buka kembali aplikasi.</p>
      <div class="actions">
        <button id="retry" type="button">Coba Lagi</button>
        <button id="reopen" type="button">Buka di Browser</button>
      </div>
    </section>
    <button id="install" type="button">Instal Fumi MKS 2</button>
  </main>
  <script>
    (function () {
      'use strict';
      const APP_URL = "https://script.google.com/a/macros/rentokil-initial.com/s/AKfycbxHeNimIA21ezcmn2I2GSISwLjVIzLvLkmqiU6Qrw-SQ0cXMuwjqxoguQRzOUFIILOm8w/exec";
      const frame = document.getElementById('app-frame');
      const loading = document.getElementById('loading');
      const problem = document.getElementById('problem');
      let loadTimer = null;
      let loaded = false;

      function startApp() {
        loaded = false;
        problem.hidden = true;
        loading.hidden = false;
        clearTimeout(loadTimer);
        frame.src = APP_URL;
        loadTimer = setTimeout(function () {
          if (!loaded) {
            loading.hidden = true;
            problem.hidden = false;
          }
        }, 35000);
      }

      frame.addEventListener('load', function () {
        loaded = true;
        clearTimeout(loadTimer);
        loading.hidden = true;
        problem.hidden = true;
      });

      document.getElementById('retry').addEventListener('click', startApp);
      document.getElementById('reopen').addEventListener('click', function () {
        window.open(APP_URL, '_blank', 'noopener');
      });

      let deferredPrompt = null;
      const installButton = document.getElementById('install');
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        installButton.style.display = 'block';
      });
      installButton.addEventListener('click', async function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installButton.style.display = 'none';
      });
      window.addEventListener('appinstalled', function () {
        installButton.style.display = 'none';
        deferredPrompt = null;
      });

      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js', {scope:'./'})
            .catch(function (error) { console.warn('PWA service worker:', error); });
        });
      }
      startApp();
    })();
  </script>
</body>
</html>
