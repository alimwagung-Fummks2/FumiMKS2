<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fumi MKS 2</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#08142c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fumi MKS 2">
    
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/90YX1YMZ/IMG-20261101-WA0000-1-removebg-preview.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/90YX1YMZ/IMG-20261101-WA0000-1-removebg-preview.png">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08142c;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #08142c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            font-family: Arial, sans-serif;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: bold; letter-spacing: 1px;">Memuat Fumi MKS 2...</div>
    </div>

    <!-- Frame Aplikasi Google Apps Script Terhubung Langsung -->
    <iframe id="appFrame" src="https://script.google.com/a/macros/rentokil-initial.com/s/AKfycbxHeNimIA21ezcmn2I2GSISwLjVIzLvLkmqiU6Qrw-SQ0cXMuwjqxoguQRzOUFIILOm8w/exec" allow="camera; microphone; geolocation" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

    <script>
        // Sembunyikan loader saat aplikasi Google Script selesai dimuat
        document.getElementById('appFrame').onload = function() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        };

        // Pendaftaran Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker terdaftar!', reg.scope))
                    .catch(err => console.log('Service Worker gagal:', err));
            });
        }
    </script>
</body>
</html>
