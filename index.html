<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08142c">
  <meta name="description" content="Fumi MKS 2 — Fumigation Operations Management System, Makassar Project Branch.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fumi MKS 2">
  <title>Fumi MKS 2 | Dashboard Operasional</title>
  <link rel="icon" type="image/png" href="./logo.png.png">
  <link rel="apple-touch-icon" href="./logo.png.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08142c;font-family:Arial, sans-serif}
    #appFrame{width:100%;height:100%;border:0;display:block;background:#f8fafc}
    #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#08142c;color:#fff;gap:14px;transition:opacity .25s ease}
    .spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #errorPanel{display:none;position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,420px);padding:24px;border-radius:14px;background:#fff;color:#0f172a;text-align:center;box-shadow:0 20px 60px #0005}
    #errorPanel button{border:0;border-radius:8px;background:#075bea;color:#fff;font-weight:700;padding:11px 18px;cursor:pointer}
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="spinner"></div>
    <strong>Memuat Fumi MKS 2...</strong>
    <small>Fumigation Operations Management System</small>
  </div>
  <div id="errorPanel">
    <h3>Aplikasi belum merespons</h3>
    <p>Periksa koneksi internet atau buka kembali aplikasi.</p>
    <button type="button" onclick="muatUlangAplikasi()">Muat Ulang</button>
  </div>
  <iframe id="appFrame" title="Fumi MKS 2 Dashboard" allow="camera; microphone" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const WEB_APP_URL = "https://script.google.com/a/macros/rentokil-initial.com/s/AKfycbzbp53PMsFtM1o5GWIF4NVXC2TZluId9fawC_XFJJjF6ef-dOgw6ZxZLnXCRC8Nj3BKJA/exec";
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    let loadTimeout = null;
    function sembunyikanLoader() {
      if (!loader || loader.style.display === 'none') return;
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 260);
      document.getElementById('errorPanel').style.display = 'none';
      clearTimeout(loadTimeout);
    }
    function muatUlangAplikasi() {
      document.getElementById('errorPanel').style.display = 'none';
      loader.style.display = 'flex'; loader.style.opacity = '1';
      frame.src = WEB_APP_URL + (WEB_APP_URL.includes('?') ? '&' : '?') + 'v=' + Date.now();
      clearTimeout(loadTimeout);
      loadTimeout = setTimeout(() => {
        loader.style.display = 'none';
        document.getElementById('errorPanel').style.display = 'block';
      }, 25000);
    }
    frame.addEventListener('load', sembunyikanLoader);
    muatUlangAplikasi();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Worker:', err));
      });
    }
  </script>
</body>
</html>
