<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08142c">
  <meta name="description" content="Fumi MKS 2 — Fumigation Operations Management System, Makassar Project Branch.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fumi MKS 2">
  <title>Fumi MKS 2 | Dashboard Operasional</title>
  <link rel="icon" type="image/png" href="./logo.png.png">
  <link rel="apple-touch-icon" href="./logo.png.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08142c;font-family:Arial, sans-serif}
    #appFrame{width:100%;height:100%;border:0;display:block;background:#f8fafc}
    #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#08142c;color:#fff;gap:14px;transition:opacity .25s ease}
    .spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #errorPanel{display:none;position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,420px);padding:24px;border-radius:14px;background:#fff;color:#0f172a;text-align:center;box-shadow:0 20px 60px #0005}
    #errorPanel button{border:0;border-radius:8px;background:#075bea;color:#fff;font-weight:700;padding:11px 18px;cursor:pointer}
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="spinner"></div>
    <strong>Memuat Fumi MKS 2...</strong>
    <small>Fumigation Operations Management System</small>
  </div>
  <div id="errorPanel">
    <h3>Aplikasi belum merespons</h3>
    <p>Periksa koneksi internet atau buka kembali aplikasi.</p>
    <button type="button" onclick="muatUlangAplikasi()">Muat Ulang</button>
  </div>
  <iframe id="appFrame" title="Fumi MKS 2 Dashboard" allow="camera; microphone" referrerpolicy="strict-origin-when-cross-origin" loading="eager"></iframe>
  <script>
    // URL deployment dipertahankan sama dengan konfigurasi GitHub saat ini.
    // Jika deployment GAS berubah, perbarui URL ini secara eksplisit.
    const WEB_APP_URL = "https://script.google.com/a/macros/rentokil-initial.com/s/AKfycbzbp53PMsFtM1o5GWIF4NVXC2TZluId9fawC_XFJJjF6ef-dOgw6ZxZLnXCRC8Nj3BKJA/exec";
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const errorPanel = document.getElementById('errorPanel');
    const LOAD_TIMEOUT_MS = 35000;
    let loadTimeout = null;
    let reloadSequence = 0;

    function sembunyikanLoader() {
      if (!loader || loader.style.display === 'none') return;
      loader.style.opacity = '0';
      window.setTimeout(() => { loader.style.display = 'none'; }, 260);
      errorPanel.style.display = 'none';
      if (loadTimeout) window.clearTimeout(loadTimeout);
      loadTimeout = null;
    }

    function tampilkanGagalMemuat() {
      if (loadTimeout) window.clearTimeout(loadTimeout);
      loadTimeout = null;
      loader.style.display = 'none';
      errorPanel.style.display = 'block';
    }

    function muatUlangAplikasi() {
      const sequence = ++reloadSequence;
      errorPanel.style.display = 'none';
      loader.style.display = 'flex';
      loader.style.opacity = '1';
      if (loadTimeout) window.clearTimeout(loadTimeout);

      // Cache-busting memastikan iframe meminta URL eksekusi GAS terbaru.
      const separator = WEB_APP_URL.includes('?') ? '&' : '?';
      frame.src = WEB_APP_URL + separator + 'fumi_refresh=' + Date.now();

      loadTimeout = window.setTimeout(() => {
        if (sequence === reloadSequence) tampilkanGagalMemuat();
      }, LOAD_TIMEOUT_MS);
    }

    // Event load hanya menandakan navigasi iframe selesai, bukan validasi login.
    frame.addEventListener('load', sembunyikanLoader);
    muatUlangAplikasi();

    // Hanya terima perintah reload dari iframe aplikasi ini dan origin Google.
    window.addEventListener('message', function(event) {
      if (event.source !== frame.contentWindow) return;
      const originDiizinkan = event.origin === 'https://script.google.com' ||
        (event.origin.startsWith('https://') && event.origin.endsWith('.googleusercontent.com'));
      if (!originDiizinkan) return;
      if (event.data === 'RELOAD_FUMI_APP') muatUlangAplikasi();
    });

    // Meminta browser memeriksa versi Service Worker terbaru tanpa menunggu siklus berkala.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js', {
            updateViaCache: 'none'
          });
          await registration.update();
        } catch (err) {
          console.warn('Pembaruan Service Worker gagal:', err);
        }
      }, { once: true });
    }
  </script>
</body>
</html>
