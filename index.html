<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fumi MKS 2</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#08142c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fumi MKS 2">
    
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="logo.png.png">
    <link rel="apple-touch-icon" href="logo.png.png">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08142c;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #loader {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-color: #08142c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 42px; 
            height: 42px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

    <!-- Layar Pemuatan (Loading Screen) -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: 700; font-size: 0.95rem; letter-spacing: 0.8px;">Memuat Fumi MKS 2...</div>
    </div>

    <!-- Frame Aplikasi Google Apps Script -->
    <iframe id="appFrame" 
        src="" 
        allow="camera; microphone; geolocation" 
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads">
    </iframe>

    <script>
        // 1. Muat URL Google Apps Script dengan Parameter Anti-Cache Waktu Nyata
        const webAppUrl = "https://script.google.com/a/macros/rentokil-initial.com/s/AKfycbxHeNimIA21ezcmn2I2GSISwLjVIzLvLkmqiU6Qrw-SQ0cXMuwjqxoguQRzOUFIILOm8w/exec";
        const noCacheUrl = webAppUrl + "?t=" + new Date().getTime();
        
        const frame = document.getElementById('appFrame');
        frame.src = noCacheUrl;

        // 2. Sembunyikan loader saat sistem Google Apps Script selesai dimuat
        frame.onload = function() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => { 
                    loader.style.display = 'none'; 
                }, 400);
            }
        };

        // 3. Registrasi Service Worker & Deteksi Pembaruan Otomatis
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        reg.onupdatefound = () => {
                            const newWorker = reg.installing;
                            newWorker.onstatechange = () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // Berkas PWA baru terdeteksi, muat ulang cache
                                    window.location.reload();
                                }
                            };
                        };
                    })
                    .catch(err => console.error('SW Error:', err));
            });
        }
    </script>
</body>
</html>
